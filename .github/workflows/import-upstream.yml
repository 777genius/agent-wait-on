name: Import upstream history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preserve reviewed upstream ancestry
        env:
          UPSTREAM_SHA: b0d82ecd12bd449f63e0eecf4f7e832cefbfc46f
        run: |
          git config user.name iliya
          git config user.email iliyazelenkog@gmail.com
          git var GIT_AUTHOR_IDENT
          git var GIT_COMMITTER_IDENT
          git fetch https://github.com/tumf/agent-exec.git "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo 'Reviewed upstream history already imported'
            exit 0
          fi
          git merge --no-ff --allow-unrelated-histories "$UPSTREAM_SHA" -m 'chore: import agent-exec v0.2.40 history'
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          git push origin HEAD:main
