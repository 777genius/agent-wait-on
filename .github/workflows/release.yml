name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, platform: linux-amd64}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64}
          - {os: macos-15, target: aarch64-apple-darwin, platform: darwin-arm64}
          - {os: macos-15-intel, target: x86_64-apple-darwin, platform: darwin-amd64}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build release binary
        run: cargo build --locked --release --bin agent-wait-on --target ${{ matrix.target }}
      - name: Prepare native plugin package
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/agent-wait-on"
          "$binary" --version
          node --experimental-strip-types scripts/package-plugin.ts --binary "$binary" --platform '${{ matrix.platform }}' --output package-stage
      - name: Smoke packaged runtime
        shell: bash
        env:
          AGENT_EXEC_ROOT: ${{ runner.temp }}/agent-wait-on-release-jobs
        run: |
          binary=package-stage/bin/agent-wait-on
          "$binary" schema > schema-result.json
          "$binary" run --forever -- echo release-smoke > job-result.json
          python3 -c 'import json; j=json.load(open("job-result.json")); assert j["state"]=="exited" and j["exit_code"]==0; assert json.load(open("schema-result.json"))["ok"]'
      - name: Archive native plugin
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          stage = Path('package-stage')
          version = json.loads((stage / 'plugin.json').read_text())['version']
          Path('dist').mkdir(exist_ok=True)
          archive = Path('dist') / f"agent-wait-on-v{version}-{os.environ['PLATFORM']}.zip"
          with ZipFile(archive, 'w', compression=ZIP_DEFLATED) as output:
              for path in sorted(stage.rglob('*')):
                  if path.is_file():
                      output.write(path, path.relative_to(stage).as_posix())
          print(archive)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  draft:
    name: Prepare verified release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify version and create checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,tomllib; assert "v"+tomllib.load(open("Cargo.toml","rb"))["package"]["version"]==os.environ["RELEASE_TAG"]'
          cp install.sh dist/
          cd dist
          sha256sum *.zip install.sh > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create draft for installed verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "agent-wait-on $GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
